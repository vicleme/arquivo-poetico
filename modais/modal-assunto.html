<div
    id="modal-assunto"
    class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-assunto-titulo"
    tabindex="-1"
>
    <div
        class="bg-white dark:bg-slate-900 rounded-lg w-full max-w-md shadow-2xl max-h-[90vh] overflow-hidden flex flex-col"
    >
        <div
            class="flex items-center justify-between px-8 pt-6 pb-3 border-b border-gray-100 dark:border-slate-700 bg-white dark:bg-slate-900 flex-shrink-0"
        >
            <h3 id="modal-assunto-titulo" class="text-2xl font-bold">Cadastrar Assunto</h3>
            <div class="flex items-center gap-1 ml-4">
                <button
                    type="button"
                    onclick="document.getElementById('form-assunto').requestSubmit()"
                    title="Salvar (atalho: Ctrl+Enter)"
                    class="w-8 h-8 flex items-center justify-center rounded-full bg-emerald-50 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-400 hover:bg-emerald-100 dark:hover:bg-emerald-900 transition-colors border border-emerald-200 dark:border-emerald-800"
                    aria-label="Salvar"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 20 20"
                        fill="currentColor"
                        class="w-4 h-4"
                    >
                        <path
                            fill-rule="evenodd"
                            d="M16.704 4.153a.75.75 0 0 1 .143 1.052l-8 10.5a.75.75 0 0 1-1.127.075l-4.5-4.5a.75.75 0 0 1 1.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 0 1 1.05-.143Z"
                            clip-rule="evenodd"
                        />
                    </svg>
                </button>
                <button
                    type="button"
                    onclick="toggleModal('modal-assunto')"
                    title="Fechar (Esc)"
                    class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-50 dark:bg-slate-800 text-gray-400 dark:text-slate-500 hover:bg-gray-100 dark:hover:bg-slate-700 hover:text-gray-600 dark:hover:text-slate-300 transition-colors border border-gray-200 dark:border-slate-700"
                    aria-label="Fechar"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 20 20"
                        fill="currentColor"
                        class="w-4 h-4"
                    >
                        <path
                            d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z"
                        />
                    </svg>
                </button>
            </div>
        </div>
        <div class="overflow-y-auto flex-1 px-8 py-6">
            <form id="form-assunto" class="grid grid-cols-1 gap-4">
                <input type="hidden" id="as-edit-id" />
                <div>
                    <label class="form-label">Nome do assunto</label>
                    <input
                        type="text"
                        id="as-nome"
                        required
                        placeholder="Ex: Sociedade e política, Identidade, Relações afetivas"
                    />
                </div>
                <div>
                    <label class="form-label">Temas</label>
                    <p class="text-[10px] text-gray-400 dark:text-slate-500 mb-2">
                        Os temas que pertencem a este assunto. Os textos que têm um desses temas
                        passam a ter este assunto. Um mesmo tema pode estar em mais de um assunto.
                        As sugestões vêm dos temas já usados nos poemas e prosas.
                    </p>
                    <div class="flex gap-2 mb-2">
                        <input
                            type="text"
                            id="as-tema-input"
                            list="sugestoes-temas-assunto"
                            class="text-sm flex-1"
                            placeholder="Ex: Machismo, Polarização..."
                        />
                        <datalist id="sugestoes-temas-assunto"></datalist>
                        <button
                            type="button"
                            onclick="adicionarTemaAssunto()"
                            class="bg-indigo-100 dark:bg-indigo-900 text-indigo-700 dark:text-indigo-300 px-3 rounded text-xs font-bold"
                        >
                            +
                        </button>
                    </div>
                    <div
                        id="as-temas-container"
                        class="flex flex-wrap gap-1 min-h-[30px] p-2 bg-white dark:bg-slate-900 border rounded border-gray-300 dark:border-slate-600"
                    ></div>
                    <input type="hidden" id="as-temas" />
                </div>
                <div>
                    <label class="form-label">Notas</label>
                    <p class="text-[10px] text-gray-400 dark:text-slate-500 mb-2">
                        Nota livre sobre este assunto — opcional, não aparece na exportação.
                    </p>
                    <textarea
                        id="as-notas"
                        class="h-24"
                        placeholder="Ex: critério usado para agrupar esses temas."
                    ></textarea>
                </div>
            </form>
        </div>
    </div>
</div>
