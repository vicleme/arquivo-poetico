<div
    id="modal-mesclar"
    class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-mesclar-titulo"
    tabindex="-1"
>
    <div
        class="bg-white dark:bg-slate-900 rounded-lg w-full max-w-md shadow-2xl max-h-[90vh] overflow-hidden flex flex-col"
    >
        <div
            class="flex items-center justify-between px-8 pt-6 pb-3 border-b border-gray-100 dark:border-slate-700 bg-white dark:bg-slate-900 flex-shrink-0"
        >
            <h3 id="modal-mesclar-titulo" class="text-2xl font-bold">Mesclar</h3>
            <button
                type="button"
                onclick="toggleModal('modal-mesclar')"
                title="Fechar (Esc)"
                class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-50 dark:bg-slate-800 text-gray-400 dark:text-slate-500 hover:bg-gray-100 dark:hover:bg-slate-700 hover:text-gray-600 dark:hover:text-slate-300 transition-colors border border-gray-200 dark:border-slate-700"
                aria-label="Fechar"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 20 20"
                    fill="currentColor"
                    class="w-4 h-4"
                >
                    <path
                        d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z"
                    />
                </svg>
            </button>
        </div>
        <div class="overflow-y-auto flex-1 px-8 py-6">
            <form id="form-mesclar" class="grid grid-cols-1 gap-4">
                <input type="hidden" id="ms-tipo" />
                <input type="hidden" id="ms-origem-id" />
                <p class="text-sm text-gray-500 dark:text-slate-400">
                    Todos os textos que referenciam
                    <strong id="ms-origem-nome" class="text-gray-800 dark:text-slate-100"></strong>
                    passam a referenciar o destino escolhido abaixo, e a entrada de origem é
                    removida do cadastro. Essa ação não pode ser desfeita.
                </p>
                <div>
                    <label class="form-label" for="ms-destino-id">Mesclar com</label>
                    <select id="ms-destino-id" required></select>
                </div>
                <div
                    class="flex justify-end gap-2 border-t pt-6 border-gray-200 dark:border-slate-700"
                >
                    <button
                        type="button"
                        onclick="toggleModal('modal-mesclar')"
                        class="text-gray-600 dark:text-slate-300 px-4 py-2"
                    >
                        Cancelar
                    </button>
                    <button
                        type="submit"
                        class="bg-amber-600 text-white px-8 py-2 rounded font-bold"
                    >
                        MESCLAR
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
