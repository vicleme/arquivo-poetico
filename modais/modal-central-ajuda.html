<div
    id="modal-central-ajuda"
    class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-central-ajuda-titulo"
    tabindex="-1"
>
    <div
        class="bg-white dark:bg-slate-900 rounded-lg w-full max-w-2xl shadow-2xl max-h-[90vh] overflow-hidden flex flex-col"
    >
        <div
            class="flex items-center justify-between px-8 pt-6 pb-3 border-b border-gray-100 dark:border-slate-700 bg-white dark:bg-slate-900 flex-shrink-0"
        >
            <h3 id="modal-central-ajuda-titulo" class="text-2xl font-bold">Central de Ajuda</h3>
            <button
                type="button"
                onclick="toggleModal('modal-central-ajuda')"
                title="Fechar (Esc)"
                class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-50 dark:bg-slate-800 text-gray-400 dark:text-slate-500 hover:bg-gray-100 dark:hover:bg-slate-700 hover:text-gray-600 dark:hover:text-slate-300 transition-colors border border-gray-200 dark:border-slate-700 flex-shrink-0 ml-4"
                aria-label="Fechar"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 20 20"
                    fill="currentColor"
                    class="w-4 h-4"
                >
                    <path
                        d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z"
                    />
                </svg>
            </button>
        </div>

        <div class="overflow-y-auto flex-1 px-8 py-6 space-y-6">
            <!-- 1. Apresentação: o texto do botão ("Ver"/"Rever") é definido em
                 central-ajuda.js conforme já existe perfil salvo. -->
            <section class="space-y-2">
                <p class="text-sm text-gray-600 dark:text-slate-300">
                    Novo por aqui, ou faz tempo que não abre o app? A apresentação mostra o
                    essencial pelo seu perfil.
                </p>
                <button
                    type="button"
                    id="ca-btn-apresentacao"
                    onclick="abrirApresentacaoDaAjuda()"
                    class="bg-blue-600 text-white px-4 py-2 rounded text-sm font-bold"
                >
                    Ver a apresentação completa
                </button>
            </section>

            <!-- 2. Procedimental: cada item vira um mini-tour (montado em JS). -->
            <section class="space-y-2">
                <h4 class="text-sm font-bold uppercase text-gray-500 dark:text-slate-400">
                    Como eu faço para...
                </h4>
                <div id="ca-como-faco-lista" class="space-y-2"></div>
            </section>

            <!-- 3. Conceitual: só texto, agrupado por categoria (montado em JS). -->
            <section class="space-y-2">
                <h4 class="text-sm font-bold uppercase text-gray-500 dark:text-slate-400">
                    Perguntas frequentes
                </h4>
                <div id="ca-faq-lista" class="space-y-4"></div>
            </section>
        </div>
    </div>
</div>
