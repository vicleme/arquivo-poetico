<div
    id="modal-relatorio-periodos"
    class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-relatorio-periodos-titulo"
    tabindex="-1"
>
    <div
        class="bg-white dark:bg-slate-900 rounded-lg w-full max-w-xl shadow-2xl max-h-[90vh] overflow-hidden flex flex-col"
    >
        <div
            class="flex items-center justify-between px-6 pt-5 pb-3 border-b border-gray-100 dark:border-slate-700 flex-shrink-0"
        >
            <h3
                id="modal-relatorio-periodos-titulo"
                class="text-xl font-bold text-gray-800 dark:text-slate-100"
            >
                Baixar relatório
            </h3>
            <button
                type="button"
                onclick="toggleModal('modal-relatorio-periodos')"
                title="Fechar (Esc)"
                class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-50 dark:bg-slate-800 text-gray-400 dark:text-slate-500 hover:bg-gray-100 dark:hover:bg-slate-700 hover:text-gray-600 dark:hover:text-slate-300 transition-colors border border-gray-200 dark:border-slate-700 flex-shrink-0 ml-4"
                aria-label="Fechar"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 20 20"
                    fill="currentColor"
                    class="w-4 h-4"
                >
                    <path
                        d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z"
                    />
                </svg>
            </button>
        </div>

        <div class="overflow-y-auto flex-1 px-6 py-5 space-y-5">
            <p id="rel-per-intro" class="text-sm text-gray-600 dark:text-slate-300"></p>

            <fieldset class="space-y-2">
                <legend class="form-label mb-1">Linha do tempo</legend>
                <label class="flex items-start gap-2 text-sm cursor-pointer">
                    <input
                        type="checkbox"
                        id="rel-per-org-data"
                        checked
                        onchange="atualizarModalRelatorioPeriodos()"
                        style="width: auto; margin-top: 3px"
                    />
                    <span>
                        <strong>Por data</strong>
                        <span class="block text-xs text-gray-500 dark:text-slate-400">
                            Agrupada por século, do mais antigo ao mais recente. Quem não tem data
                            vai para o fim.
                        </span>
                    </span>
                </label>
                <label class="flex items-start gap-2 text-sm cursor-pointer">
                    <input
                        type="checkbox"
                        id="rel-per-org-arvore"
                        onchange="atualizarModalRelatorioPeriodos()"
                        style="width: auto; margin-top: 3px"
                    />
                    <span>
                        <strong>Em árvore</strong>
                        <span class="block text-xs text-gray-500 dark:text-slate-400">
                            Cada item aparece dentro daquele que o contém.
                        </span>
                    </span>
                </label>
                <p class="text-xs text-gray-500 dark:text-slate-400">
                    Marcando as duas, cada uma vem em seu arquivo, em cada formato escolhido.
                </p>
            </fieldset>

            <fieldset class="space-y-2">
                <legend class="form-label mb-1">Formato</legend>
                <label class="flex items-center gap-2 text-sm cursor-pointer">
                    <input
                        type="checkbox"
                        id="rel-per-fmt-md"
                        checked
                        onchange="atualizarModalRelatorioPeriodos()"
                        style="width: auto"
                    />
                    <span><strong>.md</strong> (texto simples, bom para colar numa IA)</span>
                </label>
                <label class="flex items-center gap-2 text-sm cursor-pointer">
                    <input
                        type="checkbox"
                        id="rel-per-fmt-pdf"
                        onchange="atualizarModalRelatorioPeriodos()"
                        style="width: auto"
                    />
                    <span><strong>.pdf</strong> (para ler e imprimir)</span>
                </label>
            </fieldset>

            <fieldset class="space-y-2">
                <legend class="form-label mb-1">Textos ligados a cada item</legend>
                <label class="flex items-center gap-2 text-sm cursor-pointer">
                    <input
                        type="radio"
                        name="rel-per-textos"
                        id="rel-per-textos-nenhum"
                        value="nenhum"
                        onchange="atualizarModalRelatorioPeriodos()"
                        style="width: auto"
                    />
                    Nenhum
                </label>
                <label class="flex items-center gap-2 text-sm cursor-pointer">
                    <input
                        type="radio"
                        name="rel-per-textos"
                        id="rel-per-textos-contagem"
                        value="contagem"
                        checked
                        onchange="atualizarModalRelatorioPeriodos()"
                        style="width: auto"
                    />
                    Só a contagem
                </label>
                <label class="flex items-center gap-2 text-sm cursor-pointer">
                    <input
                        type="radio"
                        name="rel-per-textos"
                        id="rel-per-textos-titulos"
                        value="titulos"
                        onchange="atualizarModalRelatorioPeriodos()"
                        style="width: auto"
                    />
                    Contagem e títulos
                </label>
            </fieldset>

            <fieldset id="rel-per-bloco-ocultos" class="hidden">
                <label class="flex items-start gap-2 text-sm cursor-pointer">
                    <input
                        type="checkbox"
                        id="rel-per-ocultos"
                        style="width: auto; margin-top: 3px"
                    />
                    <span>
                        <strong>Incluir dados ocultados</strong>
                        <span class="block text-xs text-gray-500 dark:text-slate-400">
                            Por padrão, os períodos ocultos ficam de fora e seus textos não entram
                            na contagem do período que os contém.
                        </span>
                    </span>
                </label>
            </fieldset>

            <div>
                <p class="form-label mb-1">Arquivos que vão ser baixados</p>
                <ul
                    id="rel-per-arquivos"
                    class="text-sm text-gray-700 dark:text-slate-300 list-disc pl-5 space-y-0.5"
                ></ul>
                <p
                    id="rel-per-aviso-varios"
                    class="hidden text-xs text-gray-500 dark:text-slate-400 mt-2"
                >
                    O navegador pode pedir permissão para baixar mais de um arquivo.
                </p>
            </div>
        </div>

        <div
            class="flex justify-end gap-2 px-6 py-4 border-t border-gray-100 dark:border-slate-700 flex-shrink-0"
        >
            <button
                type="button"
                onclick="toggleModal('modal-relatorio-periodos')"
                class="border border-gray-300 dark:border-slate-600 text-gray-600 dark:text-slate-300 px-4 py-2 rounded hover:bg-gray-50 dark:hover:bg-slate-800"
            >
                Cancelar
            </button>
            <button
                type="button"
                id="rel-per-baixar"
                onclick="baixarRelatorioPeriodos()"
                class="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700 dark:hover:bg-blue-500 disabled:opacity-50 disabled:cursor-not-allowed"
            >
                Baixar
            </button>
        </div>
    </div>
</div>
